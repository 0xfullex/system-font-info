name: CI

# `origin` is the CI trigger, not a review gate: every push to every branch runs the checks and the tests of every target.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Node.js major every target is tested with; `node-versions` covers the other supported majors.
  NODE_MAJOR: 24
  # The packages the Linux container installs before building: the headers the addon is built against, and the
  # fonts and fontconfig the tests need (a container has no system fonts, and the tests assert that fonts are listed).
  LINUX_PACKAGES: fontconfig-devel freetype-devel fontconfig dejavu-sans-fonts google-noto-sans-cjk-ttc-fonts

jobs:
  # Checks that do not depend on the platform run once.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm
      # The major version is pinned by scripts/clang-format.mjs.
      - name: Install clang-format
        run: pipx install clang-format==20.1.8
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Check the generated files
        run: |
          npm run build:ts
          node scripts/gen-fields.mjs --check
          node scripts/gen-orthographies.mjs --check

  # The target table (ts/targets.ts) is the only list of targets; the test matrix is made from it.
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: matrix
        uses: ./.github/actions/target-matrix
        with:
          node-major: ${{ env.NODE_MAJOR }}

  # Each target is built and tested natively on its own runner, never cross-compiled. Linux targets build and test in
  # a manylinux container, as the release build does, so the addon is tested against the oldest glibc, fontconfig and
  # FreeType it supports.
  test:
    needs: targets
    name: test (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/build-addon
        with:
          id: ${{ matrix.id }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          node-major: ${{ env.NODE_MAJOR }}
          linux-packages: ${{ env.LINUX_PACKAGES }}
          # The target table decides whether the test suite runs; a target with tests off is only built and loaded.
          verify: ${{ matrix.tests && 'tests' || 'load' }}

  # The addon is a Node-API binary, so other Node.js versions differ only in the JavaScript layer: one platform is enough.
  node-versions:
    name: test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test in a manylinux container
        run: scripts/ci/linux-container.sh quay.io/pypa/manylinux_2_28_x86_64 ${{ matrix.node }} $LINUX_PACKAGES
